name: Publish

# Intentionally narrow triggers: publishing to PyPI must never happen on an
# ordinary push. Production publication only fires when a maintainer
# publishes a GitHub Release; TestPyPI publication is manual-only via
# workflow_dispatch, so a TestPyPI upload always requires a deliberate
# action, never happens automatically.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to (manual runs only ever target TestPyPI)"
        required: true
        type: choice
        options:
          - testpypi
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aei-geo-features
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned to an immutable commit SHA (v1.14.0), not a floating tag,
      # since this step is what actually authenticates to PyPI via OIDC.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aei-geo-features
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Pinned to an immutable commit SHA (v1.14.0), not a floating tag,
      # since this step is what actually authenticates to PyPI via OIDC.
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

# No PyPI API token is used anywhere in this workflow. Both publish jobs
# authenticate exclusively via PyPI Trusted Publishing (OIDC) - see
# docs/PUBLISHING.md. This requires a one-time "pending publisher"
# registration on pypi.org and test.pypi.org (owner=AIDEdgeInc-Lab,
# repo=aei-geo-features, workflow=publish.yml, environment=pypi/testpypi
# respectively) before either publish job can succeed - that registration
# is a manual, human, web-UI action on PyPI's own site and cannot be done
# through this repository or its GitHub Actions.
